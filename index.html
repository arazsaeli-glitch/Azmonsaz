<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شوخی با فخری 🤣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%;
    overflow:hidden;
    font-family: 'Tahoma', 'Vazir', sans-serif;
    background:#05010f;
    color:#fff;
  }

  /* ===== پس‌زمینه سه بعدی ===== */
  .scene {
    position:fixed;
    inset:0;
    perspective: 900px;
    overflow:hidden;
  }

  .grid {
    position:absolute;
    inset:-50%;
    background-image:
      linear-gradient(rgba(0,255,247,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,200,.28) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: rotateX(70deg) translateZ(-200px);
    animation: gridMove 6s linear infinite;
    filter: drop-shadow(0 0 12px #00fff7);
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 0 60px; }
  }

  .glow1, .glow2 {
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:.55;
    animation: float 8s ease-in-out infinite;
  }
  .glow1 {
    width:480px; height:480px;
    background:#7b2ff7;
    top:-120px; right:-100px;
  }
  .glow2 {
    width:520px; height:520px;
    background:#ff2ea6;
    bottom:-160px; left:-120px;
    animation-delay:2s;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-40px) scale(1.12); }
  }

  /* ===== کارت شیشه‌ای سه بعدی ===== */
  .wrap {
    position:relative;
    z-index:10;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .card {
    position:relative;
    max-width:760px;
    width:100%;
    padding:60px 40px;
    text-align:center;
    border-radius:28px;
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(18px);
    box-shadow:
      0 30px 70px rgba(0,0,0,.65),
      0 0 60px rgba(123,47,247,.45),
      inset 0 0 40px rgba(0,255,247,.08);
    transform-style: preserve-3d;
    animation: cardFloat 5s ease-in-out infinite, cardIn 1s cubic-bezier(.2,.9,.3,1.4) both;
    transition: transform .18s ease-out;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(70px) rotateX(25deg) scale(.85); }
    to   { opacity:1; transform: translateY(0)   rotateX(0)     scale(1); }
  }
  @keyframes cardFloat {
    0%,100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50%     { transform: translateY(-14px) rotateX(4deg) rotateY(-3deg); }
  }

  .card::before {
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:30px;
    padding:2px;
    background: linear-gradient(135deg,#00fff7,#7b2ff7,#ff2ea6,#00fff7);
    background-size:300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: borderFlow 5s linear infinite;
    pointer-events:none;
  }
  @keyframes borderFlow {
    0%   { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }

  h1 {
    font-size: clamp(20px, 4.2vw, 38px);
    line-height:1.7;
    font-weight:900;
    background: linear-gradient(90deg,#00fff7,#b06bff,#ff2ea6,#00fff7);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: textFlow 4s linear infinite;
    text-shadow: 0 0 40px rgba(176,107,255,.5);
    transform: translateZ(50px);
  }
  @keyframes textFlow {
    to { background-position: 300% 0; }
  }

  /* ایموجی بزرگ زیر تیتر — کاملاً مستقل، بدون background-clip */
  .emoji-big {
    font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: clamp(48px, 8vw, 80px);
    line-height: 1.2;
    margin-top: 20px;
    display: block;
    filter: drop-shadow(0 0 20px #ffd93b) drop-shadow(0 0 40px #ff2ea6);
    animation: laughBounce 1.5s ease-in-out infinite;
    transform: translateZ(60px);
  }

  /* انیمیشن مشترک خنده */
  @keyframes laughBounce {
    0%,100% { transform: translateY(0)     rotate(-14deg) scale(1); }
    50%     { transform: translateY(-16px) rotate(14deg)  scale(1.25); }
  }

  .sub {
    margin-top:34px;
    font-size: clamp(15px, 2.4vw, 21px);
    color:#d9d3ff;
    line-height:1.9;
    transform: translateZ(35px);
    text-shadow:0 0 20px rgba(0,255,247,.35);
  }

  /* ===== دکمه ===== */
  .btn {
    position:relative;
    margin-top:44px;
    padding:18px 60px;
    font-family:inherit;
    font-size: clamp(16px, 2.6vw, 22px);
    font-weight:900;
    color:#fff;
    cursor:pointer;
    border:none;
    border-radius:60px;
    background: linear-gradient(135deg,#7b2ff7,#ff2ea6);
    box-shadow:
      0 15px 35px rgba(255,46,166,.45),
      0 0 45px rgba(123,47,247,.7),
      inset 0 0 20px rgba(255,255,255,.25);
    transform: translateZ(70px);
    transition: transform .2s ease, box-shadow .2s ease, letter-spacing .2s;
    overflow:hidden;
  }
  .btn::after {
    content:"";
    position:absolute;
    top:0; left:-120%;
    width:60%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform: skewX(-25deg);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { left:-120%; }
    60%  { left:130%; }
    100% { left:130%; }
  }
  .btn:hover {
    transform: translateZ(90px) scale(1.07);
    letter-spacing:2px;
    box-shadow:
      0 20px 50px rgba(255,46,166,.7),
      0 0 80px rgba(123,47,247,1),
      inset 0 0 30px rgba(255,255,255,.4);
  }
  .btn:active { transform: translateZ(60px) scale(.96); }

  /* ===== صفحه دوم ===== */
  .final {
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 40%, #1a0033, #05010f 75%);
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease;
    padding:20px;
  }
  .final.show {
    opacity:1;
    pointer-events:auto;
  }

  .final h2 {
    font-size: clamp(24px, 6vw, 60px);
    font-weight:900;
    text-align:center;
    line-height:1.8;
    background: linear-gradient(90deg,#ff2ea6,#ffd93b,#00fff7,#ff2ea6);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: textFlow 3s linear infinite, pop .6s cubic-bezier(.2,.9,.3,1.6) both;
    filter: drop-shadow(0 0 30px rgba(255,46,166,.6));
  }
  @keyframes pop {
    from { transform: scale(.3) rotate(-8deg); opacity:0; }
    to   { transform: scale(1) rotate(0); opacity:1; }
  }

  /* ردیف ایموجی‌های صفحه دوم — کاملاً مستقل */
  .emoji-final-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }
  .emoji-final-row span {
    font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: clamp(50px, 9vw, 90px);
    line-height: 1;
    filter: drop-shadow(0 0 20px #ffd93b) drop-shadow(0 0 35px #ff2ea6);
    display: inline-block;
    animation: laughBounce 1.4s ease-in-out infinite;
  }
  .emoji-final-row span:nth-child(2) { animation-delay: .18s; }
  .emoji-final-row span:nth-child(3) { animation-delay: .36s; }

  .final .back {
    position:absolute;
    bottom:40px;
    left:50%;
    transform: translateX(-50%);
    padding:12px 34px;
    border-radius:40px;
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    backdrop-filter: blur(10px);
    transition: background .25s, transform .25s;
  }
  .final .back:hover {
    background: rgba(255,255,255,.2);
    transform: translateX(-50%) scale(1.08);
  }

  /* ستاره‌های ریز */
  .stars {
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .star {
    position:absolute;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 10px #00fff7;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:.2; transform:scale(.6); }
    50%     { opacity:1;  transform:scale(1.5); }
  }
</style>
</head>
<body>

<!-- پس‌زمینه -->
<div class="scene">
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
</div>

<div class="stars" id="stars"></div>

<!-- صفحه اصلی -->
<div class="wrap">
  <div class="card" id="card">
    <h1>آقای فخری فکر کردی من آدرس دامنه سایتم رو میدم</h1>
    <div class="emoji-big">🤣</div>
    <p class="sub">نه شوخی کردم فخری، روی دکمه زیر بزن تا وارد سایت بشی</p>
    <button class="btn" id="enterBtn">ورود به سایت</button>
  </div>
</div>

<!-- صفحه دوم -->
<div class="final" id="final">
  <h2>فکر کردی من دامنه سایتم رو میدم</h2>
  <div class="emoji-final-row">
    <span>🤣</span><span>🤣</span><span>🤣</span>
  </div>
  <button class="back" id="backBtn">↩ برگرد</button>
</div>

<script>
  /* ستاره‌های تصادفی */
  const starsBox = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    starsBox.appendChild(s);
  }

  /* افکت سه‌بعدی حرکت ماوس روی کارت */
  const card = document.getElementById('card');
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth  - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);
    card.style.transform =
      `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) translateZ(20px)`;
  });
  document.addEventListener('mouseleave', () => {
    card.style.transform = '';
  });

  /* دکمه ورود */
  const finalScreen = document.getElementById('final');
  document.getElementById('enterBtn').addEventListener('click', () => {
    finalScreen.classList.add('show');
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    finalScreen.classList.remove('show');
  });
</script>
</body>
</html>
